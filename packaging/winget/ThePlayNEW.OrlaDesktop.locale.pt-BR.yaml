ShortDescription: Painéis translúcidos que organizam a área de trabalho do Windows.
Description: |-
  O Orla Desktop coloca painéis translúcidos na camada da área de trabalho do Windows para agrupar atalhos
  e mostrar pastas, sem mover nenhum dos seus arquivos. Os painéis continuam no lugar com Win+D, a área de
  trabalho mantém a seleção, o menu de contexto e o arrastar e soltar de sempre, e Ctrl+Alt+Espaço traz os
  painéis para a frente das janelas. Funciona sem direitos de administrador e não injeta código no Explorer.

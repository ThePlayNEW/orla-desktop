ShortDescription: Translucent panels that organize the Windows desktop.
Description: |-
  Orla Desktop places translucent panels on the Windows desktop layer to group shortcuts and show folders,
  without moving any of your files. Panels stay in place with Win+D, the desktop keeps its usual selection,
  context menu and drag and drop, and Ctrl+Alt+Space brings the panels in front of your windows.
  Runs without administrator rights and does not inject code into Explorer.
